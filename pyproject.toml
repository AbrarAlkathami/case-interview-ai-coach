[project]
name = "temporary-structures"
version = "0.1.0"
description = ""
authors = [
    {name = "AbrarAlkathami",email = "AbrarAlkathami@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "langchain-openai (>=0.3.0,<0.4.0)",
    "sqlalchemy (>=2.0.52,<3.0.0)",
    "dotenv (>=0.9.9,<0.10.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "alembic (>=1.19.1,<2.0.0)",
]

[tool.poetry]
packages = [{include = "temporary_structures", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
